# Force basic-auth on. This file is loaded LAST in MICRONAUT_CONFIG_FILES (see
# docker-compose-ci.yml) so these keys win over application-secrets.yml, which in CI
# may otherwise disable basic-auth and break the test credentials.
micronaut:
  security:
    enabled: true
    basic-auth:
      enabled: true

kestra:
  security:
     super-admin:
       username: root@root.com
       password: Root!1234
       tenantAdminAccess: main
  encryption:
    secret-key: LWBErwwlb/BQcxWujsm+/scPeO01cTKzvW44GbAWvII=
  kafka: 
    client:
      properties:
        bootstrap.servers: kafka:9092
  elasticsearch:
    client:
      http-hosts: http://elasticsearch:9200
  repository:
    type: elasticsearch
  storage:
    type: local
    local:
      base-path: "/app/storage"
  queue:
    type: kafka
  # Kestra 2.0 dropped the built-in Vault secret backend: rc2 fails to start with
  # "No secret interface can be found for 'kestra.secret.type=vault'. Supported types
  # are: [elasticsearch,jdbc]". Elasticsearch matches the repository backend already
  # configured above, and nothing in the tests depends on Vault specifically — the
  # `secret_type = "vault"` values in the namespace/tenant tests are free-form
  # per-namespace config strings, unrelated to this instance-level setting.
  secret:
    type: elasticsearch
    elasticsearch:
      secret: "e2e-tests-elasticsearch-secret-key-32min"
  ee:
    tenants:
      enabled: true
