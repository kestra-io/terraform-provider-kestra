name: Docs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: terraform-provider-kestra

      - name: Checkout docs
        uses: kestra-io/actions/composite/checkout-and-auth@main
        with:
          gh-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repository: kestra-io/docs
          path: docs
          ref: main

      - name: Transform docs for website
        run: |
          terraform-provider-kestra/.github/scripts/docs-to-website.sh \
            terraform-provider-kestra/docs \
            docs/src/contents/docs/13.terraform

      - name: Generate docs app token
        id: docs-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: kestra-io
          repositories: docs

      - name: Open PR with docs change
        env:
          GH_TOKEN: ${{ steps.docs-app-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd docs
          BRANCH="chore/terraform-docs-${REF_NAME}"
          git add src/contents/docs/13.terraform/
          git rm -r --quiet --ignore-unmatch content/docs/13.terraform
          git diff --cached --quiet && { echo "No docs changes, skipping."; exit 0; }
          git checkout -b "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "feat(docs): update terraform docs"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "feat(docs): update terraform docs (${REF_NAME})" \
            --body "Automated docs update triggered by terraform-provider-kestra release ${REF_NAME}.")
          gh api "repos/kestra-io/docs/pulls/${PR_URL##*/}/requested_reviewers" -f "team_reviewers[]=docs" --silent

      - name: Slack - Notify CI failure
        if: failure()
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: 'C09FE0QCN2E'
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
