services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 127.27.27.27:9200:9200

  kestra:
    image: ghcr.io/kestra-io/kestra-ee:${KESTRA_VERSION}
    # it may be easier to use gcp registry in local
#    image: europe-west1-docker.pkg.dev/kestra-host/docker/kestra-ee:${KESTRA_VERSION}
    command: server standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/health"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
    volumes:
      - ./.github/docker/application.yml:/app/confs/application.yml:ro
      - ./.github/docker/application-secrets.yml:/app/secrets/application-secrets.yml:ro
    environment:
      # application.yml is loaded LAST so its config (notably super-admin) wins over
      # application-secrets.yml. Micronaut gives files later in the list higher precedence
      # and config files outrank environment variables, so ordering is the only reliable lever.
      MICRONAUT_CONFIG_FILES: /app/secrets/application-secrets.yml,/app/confs/application.yml

    ports:
      - 127.27.27.27:8080:8080
      - 8088:8080 # allowing to run tests in local
    links:
      - vault
    depends_on:
      elasticsearch:
        condition: service_healthy
      vault:
        condition: service_healthy

  vault:
    image: hashicorp/vault
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: [ "CMD-SHELL", "vault status -format=json | grep '\"initialized\": true'" ]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    environment:
      VAULT_ADDR: http://localhost:8200
      VAULT_API_ADDR: http://localhost:8200
      VAULT_TOKEN: my-vault-root-token
      VAULT_LOG_LEVEL: DEBUG
      VAULT_DEV_ROOT_TOKEN_ID: my-vault-root-token
